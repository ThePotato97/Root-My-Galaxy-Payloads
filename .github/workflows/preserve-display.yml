name: Build and publish display-preserving payload

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the built generic daemon and feed to the selected branch
        type: boolean
        default: true
  push:
    branches:
      - fix/fold7-preserve-display-restart
    paths:
      - kernelsu/restart-patches/KernelSU-Next-v3.4.2-preserve-display.patch
      - .github/workflows/ksu-build.yml
      - .github/workflows/preserve-display.yml
      - tests/preserve-display/**
  pull_request:
    paths:
      - 'kernelsu/restart-patches/KernelSU-Next-v3.4.2-preserve-display.patch'
      - '.github/workflows/ksu-build.yml'
      - 'tests/preserve-display/**'
      - '.github/workflows/preserve-display.yml'

permissions:
  contents: write

concurrency:
  group: preserve-display-${{ github.ref }}
  cancel-in-progress: true

env:
  FLAVOR: kernelsu-next
  FLAVOR_REPO: KernelSU-Next/KernelSU-Next
  FLAVOR_TOOLCHAIN: stable
  KSU_REF: v3.4.2
  PATCH: kernelsu/patches/KernelSU-Next-v3.4.2-samsung-kdp-rkp-defex.patch
  CARGO_ARGS: --manifest-path userspace/ksud/Cargo.toml

jobs:
  host-tests:
    name: Restart orchestration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: 4c706b5938665866ebe16944a481a7b91e3396af
          path: KernelSU
      - name: Apply Samsung and restart patches
        run: |
          git -C KernelSU apply "$GITHUB_WORKSPACE/${{ env.PATCH }}"
          git -C KernelSU apply --check "$GITHUB_WORKSPACE/kernelsu/restart-patches/KernelSU-Next-v3.4.2-preserve-display.patch"
          git -C KernelSU apply "$GITHUB_WORKSPACE/kernelsu/restart-patches/KernelSU-Next-v3.4.2-preserve-display.patch"
      - name: Run host tests against patched daemon source
        env:
          KSUD_RESTART_SOURCE: ${{ github.workspace }}/KernelSU/userspace/ksud/src/soft_reboot.rs
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked --manifest-path tests/preserve-display/Cargo.toml -- --test-threads=1

  generic-build:
    name: Android 15 / 6.6 generic daemon and modules
    needs: host-tests
    uses: ./.github/workflows/ksu-build.yml
    with:
      flavor: kernelsu-next
      ksu_ref: v3.4.2
      generic_kmis: '["android15-6.6"]'
      preserve_display: true
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
